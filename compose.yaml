services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://weblab.z-evolutions.de

      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: warning

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ze_weblab
      DB_USERNAME: ze_weblab
      DB_PASSWORD: ${DB_PASSWORD}

      SESSION_DRIVER: redis
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      FILESYSTEM_DISK: local

    expose:
      - "9000"

    volumes:
      - app_storage:/var/www/html/storage

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy


  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped

    ports:
      - "127.0.0.1:9463:80"

    volumes:
      - app_storage:/var/www/html/storage:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_started


  database:
    image: mariadb:11.8
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: ze_weblab
      MARIADB_USER: ze_weblab
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s


  redis:
    image: redis:8.8.1-trixie
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 20


  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped

    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=90

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://weblab.z-evolutions.de

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ze_weblab
      DB_USERNAME: ze_weblab
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - app_storage:/var/www/html/storage

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy


  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped

    command:
      - php
      - artisan
      - schedule:work

    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: https://weblab.z-evolutions.de

      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ze_weblab
      DB_USERNAME: ze_weblab
      DB_PASSWORD: ${DB_PASSWORD}

      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - app_storage:/var/www/html/storage

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  app_storage:
  mariadb_data:
  redis_data: